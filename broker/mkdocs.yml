site_name: browser-broker
site_description: >-
  browser-broker is a local proxy on Chrome's DevTools port 9222 that gives each
  AI agent its own private tab in your real, logged-in Chrome or Brave, so agents
  never steal each other's tabs or yours.
site_author: Matt Macosko
site_url: https://nicedreamzapp.github.io/browser-agent/
repo_url: https://github.com/nicedreamzapp/browser-agent
repo_name: nicedreamzapp/browser-agent
edit_uri: edit/main/broker/docs/
copyright: Copyright &copy; 2026 Nice Dreamz LLC. MIT License.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - social
  # sitemap.xml is generated by MkDocs itself on every build (needs site_url).

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn
