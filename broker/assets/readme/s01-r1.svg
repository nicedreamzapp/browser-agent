<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="One tab each. Each agent gets its own private tab in your real, logged-in browser. Zero tool changes. Your tools keep dialing port 9222 exactly as they do today. Tab ownership. Agents cannot see or steal each other&#x27;s tabs, or yours."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="301.4" height="133" rx="10"/></clipPath><rect width="301.4" height="133" rx="10" fill="url(#n)"/><rect width="301.4" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="300.4" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="153" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🚦 One tab each</text><text x="153" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Each agent gets its own private</text><text x="153" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">tab in your real, logged-in</text><text x="153" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">browser.</text></g><g transform="translate(313.4,0)"><clipPath id="c0_1"><rect width="263.7" height="133" rx="10"/></clipPath><rect width="263.7" height="133" rx="10" fill="url(#n)"/><rect width="263.7" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="262.7" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="134" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🔌 Zero tool changes</text><text x="134" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Your tools keep dialing port</text><text x="134" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">9222 exactly as they do</text><text x="134" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">today.</text></g><g transform="translate(589.1,0)"><clipPath id="c0_2"><rect width="230.9" height="133" rx="10"/></clipPath><rect width="230.9" height="133" rx="10" fill="url(#n)"/><rect width="230.9" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="229.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="117" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🔒 Tab ownership</text><text x="117" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Agents cannot see or</text><text x="117" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">steal each other&#x27;s tabs,</text><text x="117" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">or yours.</text></g></g></svg>
