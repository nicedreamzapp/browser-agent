<svg xmlns="http://www.w3.org/2000/svg" width="358" height="327" viewBox="0 0 358 327" role="img" aria-label="Port 9222. The proxy takes it; your real browser moves to 9229 behind it. Focus blocked. Calls that would steal your screen are answered and never forwarded. Tabs you did not open do not exist. They are invisible to every agent."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🔌 Port 9222</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The proxy takes it; your real browser moves</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">to 9229 behind it.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🛑 Focus blocked</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Calls that would steal your screen are</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">answered and never forwarded.</text></g><g transform="translate(0.0,224)"><clipPath id="c2_0"><rect width="358.0" height="103" rx="10"/></clipPath><rect width="358.0" height="103" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="102" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">👻 Tabs you did not open do not</text><text x="181" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#decdd4">exist</text><text x="181" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">They are invisible to every agent.</text></g></g></svg>
