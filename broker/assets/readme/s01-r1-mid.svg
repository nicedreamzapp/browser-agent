<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img" aria-label="One tab each. Each agent gets its own private tab in your real, logged-in browser. Zero tool changes. Your tools keep dialing port 9222 exactly as they do today. Tab ownership. Agents cannot see or steal each other&#x27;s tabs, or yours."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="274.5" height="125" rx="10"/></clipPath><rect width="274.5" height="125" rx="10" fill="url(#n)"/><rect width="274.5" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="273.5" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🚦 One tab each</text><text x="139" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Each agent gets its own private</text><text x="139" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">tab in your real, logged-in</text><text x="139" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">browser.</text></g><g transform="translate(284.5,0)"><clipPath id="c0_1"><rect width="275.5" height="125" rx="10"/></clipPath><rect width="275.5" height="125" rx="10" fill="url(#n)"/><rect width="275.5" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.5" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🔌 Zero tool changes</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Your tools keep dialing port</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">9222 exactly as they do today.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#2f7f7a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🔒 Tab ownership</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Agents cannot see or steal each other&#x27;s tabs, or yours.</text></g></g></svg>
