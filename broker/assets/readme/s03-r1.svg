<svg xmlns="http://www.w3.org/2000/svg" width="820" height="109" viewBox="0 0 820 109" role="img" aria-label="Auto-renew. The lease renews while you work and releases on exit. Dumb rule. Agents only get tabs the broker opened. Leases expire. 300 s by default, so no deadlocks."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="109" rx="10"/></clipPath><rect width="265.3" height="109" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🔄 Auto-renew</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The lease renews while you</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">work and releases on exit.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="109" rx="10"/></clipPath><rect width="265.3" height="109" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">📏 Dumb rule</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Agents only get tabs the</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">broker opened.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="109" rx="10"/></clipPath><rect width="265.3" height="109" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a6a3a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">⏳ Leases expire</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">300 s by default, so no</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">deadlocks.</text></g></g></svg>
