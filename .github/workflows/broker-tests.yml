name: broker tests

on:
  push:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"
  pull_request:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: broker

jobs:
  pytest:
    name: broker pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Windows was verified on. 3.9 runs in its own job below.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: broker/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v --durations=10

  pytest-39:
    # 3.9 is the oldest the broker supports (and what macOS's own python3 is), but
    # setup-python no longer has it for current Ubuntu runners. The official image does.
    name: broker pytest (python 3.9)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    timeout-minutes: 10
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl >/dev/null
        working-directory: /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v --durations=10
