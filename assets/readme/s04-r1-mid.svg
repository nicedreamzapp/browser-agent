<svg xmlns="http://www.w3.org/2000/svg" width="560" height="125" viewBox="0 0 560 125" role="img" aria-label="bb-show. One agent holds the screen at a time; the next one waits its turn. Cooperative. Works because the polite path is one word shorter than the rude one."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="256.4" height="125" rx="10"/></clipPath><rect width="256.4" height="125" rx="10" fill="url(#n)"/><rect width="256.4" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="255.4" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🎦 bb-show</text><text x="130" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One agent holds the screen</text><text x="130" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">at a time; the next one waits</text><text x="130" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">its turn.</text></g><g transform="translate(266.4,0)"><clipPath id="c0_1"><rect width="293.6" height="125" rx="10"/></clipPath><rect width="293.6" height="125" rx="10" fill="url(#n)"/><rect width="293.6" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="292.6" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🤝 Cooperative</text><text x="149" text-anchor="middle" y="65" font-size="16" font-